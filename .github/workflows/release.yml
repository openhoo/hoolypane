name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:electron
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm pins:check && pnpm architecture && pnpm exec knip && pnpm typecheck && pnpm test:unit && pnpm test:runner
      - run: pnpm benchmark:recording
      - run: pnpm build && pnpm pack:runner
      - name: Smoke packed runner in clean project
        shell: bash
        run: |
          project="$(mktemp -d)"
          cd "$project"
          npm init -y
          npm install "$GITHUB_WORKSPACE"/dist/hoolypane-runner-*.tgz
          output="$(npx hoolypane --help 2>&1 || true)"
          case "$output" in *"Usage: hoolypane <command>"*"run <flow-file>"*) ;; *) printf '%s\n' "$output" >&2; exit 1 ;; esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-tarball
          path: dist/*.tgz

  desktop:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: package:linux
          - os: windows-latest
            command: package:windows
          - os: macos-latest
            command: package:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:electron
      - run: pnpm exec playwright install chromium
      - run: pnpm build
      - name: Run Linux desktop E2E
        if: runner.os == 'Linux'
        run: env -u DBUS_SESSION_BUS_ADDRESS -u WAYLAND_DISPLAY LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- xvfb-run -a pnpm test:desktop
      - name: Run native desktop E2E
        if: runner.os != 'Linux'
        run: pnpm test:desktop
      - name: Run Linux desktop performance gate
        if: runner.os == 'Linux'
        run: env -u DBUS_SESSION_BUS_ADDRESS -u WAYLAND_DISPLAY LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- xvfb-run -a pnpm benchmark:desktop
      - name: Run native desktop performance gate
        if: runner.os != 'Linux'
        run: pnpm benchmark:desktop
      - name: Package native desktop
        run: pnpm ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke Linux package
        if: runner.os == 'Linux'
        run: env -u DBUS_SESSION_BUS_ADDRESS -u WAYLAND_DISPLAY LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- xvfb-run -a pnpm smoke:desktop-package -- dist/desktop
      - name: Smoke native package
        if: runner.os != 'Linux'
        run: pnpm smoke:desktop-package -- dist/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/desktop/*

  publish:
    needs: [qualify, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/hoolypane-runner-*.tgz
      - name: Publish runner
        if: vars.NPM_PUBLISH_ENABLED == 'true' && env.NODE_AUTH_TOKEN != ''
        continue-on-error: true
        run: npm publish ./release-artifacts/hoolypane-runner-*.tgz --provenance --access public --tag ${{ contains(github.ref_name, '-') && 'beta' || 'latest' }}
