name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      rebuild_tag:
        description: Existing release tag whose artifacts should be rebuilt
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  HOOVERSION_VERSION: 1.0.1

jobs:
  release:
    name: Hooversion release
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, 'chore(release):')) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.rebuild.outputs.published || steps.release.outputs.published }}
      version: ${{ steps.rebuild.outputs.version || steps.release.outputs.version }}
      tag: ${{ steps.rebuild.outputs.tag || steps.release.outputs.tag }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.rebuild_tag || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.rebuild_tag == ''
        with:
          node-version: 24
      - name: Enable pnpm
        if: inputs.rebuild_tag == ''
        run: corepack enable
      - name: Set up Hooversion
        if: inputs.rebuild_tag == ''
        uses: openhoo/hooversion/actions/setup@2f977d9c91d98d800cac6557fa170cf1a7fccd39 # v1.0.1
        with:
          version: ${{ env.HOOVERSION_VERSION }}
      - name: Configure release git author
        if: inputs.rebuild_tag == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        id: release
        if: inputs.rebuild_tag == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hooversion release
      - name: Resolve rebuild target
        id: rebuild
        if: inputs.rebuild_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.rebuild_tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "rebuild_tag must be a semantic version prefixed with v" >&2
            exit 2
          fi
          version="${TAG#v}"
          manifest_version="$(node -p "require('./package.json').version")"
          if [[ "$manifest_version" != "$version" ]]; then
            echo "package.json version $manifest_version does not match $TAG" >&2
            exit 2
          fi
          gh release view "$TAG" >/dev/null
          {
            echo "published=true"
            echo "version=$version"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  qualify:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:electron
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm pins:check && pnpm architecture && pnpm exec knip && pnpm typecheck && pnpm test:unit && pnpm test:runner
      - run: pnpm benchmark:recording
      - run: pnpm build && pnpm pack:runner
      - name: Smoke packed runner in clean project
        shell: bash
        run: |
          project="$(mktemp -d)"
          cd "$project"
          npm init -y
          npm install "$GITHUB_WORKSPACE"/dist/hoolypane-runner-*.tgz
          output="$(npx hoolypane --help 2>&1 || true)"
          case "$output" in *"Usage: hoolypane <command>"*"run <flow-file>"*) ;; *) printf '%s\n' "$output" >&2; exit 1 ;; esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-tarball
          path: dist/*.tgz

  desktop:
    needs: [release, qualify]
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: package:linux
          - os: windows-latest
            command: package:windows
          - os: macos-latest
            command: package:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:electron
      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium for native E2E
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium
      - run: pnpm build
      - name: Run Linux desktop E2E
        if: runner.os == 'Linux'
        # Wrapper pins the documented Xvfb geometry and software-rendering env
        # (canonical values: scripts/xvfb.env via the package.json desktop:xvfb script); default 640x480 breaks drag E2E.
        run: pnpm test:desktop:xvfb
      - name: Run native desktop E2E
        if: runner.os != 'Linux'
        run: pnpm test:desktop
      - name: Run Linux desktop performance gate
        if: runner.os == 'Linux'
        # Same geometry contract as the E2E step above.
        run: pnpm benchmark:desktop:xvfb
      - name: Run native desktop performance gate
        if: runner.os != 'Linux'
        run: pnpm benchmark:desktop
      - name: Package native desktop
        run: pnpm ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke Linux package
        if: runner.os == 'Linux'
        # Geometry/env come from the desktop:xvfb wrapper script (canonical: scripts/xvfb.env); do not re-inline.
        run: pnpm smoke:desktop-package:xvfb -- dist/desktop
      - name: Smoke native package
        if: runner.os != 'Linux'
        run: pnpm smoke:desktop-package -- dist/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.exe
            dist/desktop/*.dmg

  publish:
    needs: [release, qualify, desktop]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-artifacts/*.AppImage release-artifacts/*.deb release-artifacts/*.dmg release-artifacts/*.exe release-artifacts/hoolypane-runner-*.tgz)
          if (( ${#assets[@]} == 0 )); then
            echo "no release assets found" >&2
            exit 1
          fi
          for artifact in "${assets[@]}"; do
            timeout 3m gh release upload "$TAG" "$artifact" --clobber
          done
      - name: Publish runner
        if: vars.NPM_PUBLISH_ENABLED == 'true' && env.NODE_AUTH_TOKEN != ''
        continue-on-error: true
        run: npm publish ./release-artifacts/hoolypane-runner-*.tgz --provenance --access public --tag ${{ contains(needs.release.outputs.tag, '-') && 'beta' || 'latest' }}
