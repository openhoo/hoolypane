name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOOVERSION_VERSION: 1.0.1

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Hooversion
        uses: openhoo/hooversion/actions/setup@2f977d9c91d98d800cac6557fa170cf1a7fccd39 # v1.0.1
        with:
          version: ${{ env.HOOVERSION_VERSION }}
      - name: Lint commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            hooversion lint --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA"
          else
            hooversion lint --last
          fi

  quality:
    needs: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:electron
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm pins:check
      - run: pnpm architecture
      - run: pnpm exec knip
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:runner
      - run: pnpm test:desktop:xvfb
      - run: pnpm benchmark:desktop:xvfb
      - run: pnpm benchmark:recording
      - run: pnpm pack:runner

  native-package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package-command: package:linux
            artifact-name: hoolypane-linux-unsigned
          - os: windows-latest
            package-command: package:windows
            artifact-name: hoolypane-windows-unsigned
          - os: macos-latest
            package-command: package:mac
            artifact-name: hoolypane-macos-unsigned
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:electron
      - name: Install Chromium for native E2E
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium
      - name: Build native desktop
        run: pnpm build
      - name: Run native desktop E2E
        if: runner.os != 'Linux'
        run: pnpm test:desktop
      - name: Run native six-pane performance gate
        if: runner.os != 'Linux'
        run: pnpm benchmark:desktop
      - name: Package native desktop
        run: pnpm ${{ matrix.package-command }}
      - name: Smoke Linux package
        if: runner.os == 'Linux'
        # Geometry/env come from the desktop:xvfb wrapper script (canonical: scripts/xvfb.env); do not re-inline.
        run: pnpm smoke:desktop-package:xvfb -- dist/desktop
      - name: Smoke native package
        if: runner.os != 'Linux'
        run: pnpm smoke:desktop-package -- dist/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.exe
            dist/desktop/*.dmg
