name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:electron
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm pins:check
      - run: pnpm architecture
      - run: pnpm exec knip
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:runner
      - run: pnpm test:desktop:xvfb
      - run: pnpm benchmark:desktop:xvfb
      - run: pnpm benchmark:recording
      - run: pnpm pack:runner

  native-package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package-command: package:linux
            artifact-name: hoolypane-linux-unsigned
          - os: windows-latest
            package-command: package:windows
            artifact-name: hoolypane-windows-unsigned
          - os: macos-latest
            package-command: package:mac
            artifact-name: hoolypane-macos-unsigned
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:electron
      - name: Build native desktop
        run: pnpm build
      - name: Run native desktop E2E
        if: runner.os != 'Linux'
        run: pnpm test:desktop
      - name: Run native six-pane performance gate
        if: runner.os != 'Linux'
        run: pnpm benchmark:desktop
      - name: Package native desktop
        run: pnpm ${{ matrix.package-command }}
      - name: Smoke Linux package
        if: runner.os == 'Linux'
        # Geometry mirrors scripts/release-dry-run.mjs; flags anchored in tests/helpers/desktop-runtime.ts.
        run: env -u DBUS_SESSION_BUS_ADDRESS -u WAYLAND_DISPLAY LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- xvfb-run -a --server-args='-screen 0 1920x1080x24' pnpm smoke:desktop-package -- dist/desktop
      - name: Smoke native package
        if: runner.os != 'Linux'
        run: pnpm smoke:desktop-package -- dist/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/desktop/*
