appId: dev.hoolypane.app
productName: Hoolypane
executableName: Hoolypane
copyright: Copyright © 2026 Hoolypane contributors
electronVersion: 43.4.1
directories:
  output: ../../dist/desktop
files:
  - dist/**
  - package.json
extraResources:
  - from: ../../LICENSE
    to: LICENSE
asarUnpack:
  - node_modules/sharp/**
artifactName: ${productName}-${version}-${os}-${arch}-unsigned.${ext}
linux:
  icon: build/icons
  category: Development
  target:
    - AppImage
    - deb
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
dmg:
  sign: false
